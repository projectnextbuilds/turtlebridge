name: Hardware test result
description: Record a repeatable, sanitized controller observation.
title: "[Hardware]: "
labels: ["hardware-test"]
body:
  - type: markdown
    attributes:
      value: A USB device appearing is not proof of readable input or game compatibility. Report only what the test demonstrates.
  - type: input
    id: controller
    attributes:
      label: Controller manufacturer and exact model
    validations:
      required: true
  - type: input
    id: connection
    attributes:
      label: Connection method
      placeholder: Wired USB through direct port or named adapter type
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and architecture
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: TurtleBridge commit or release
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Test procedure
      description: Provide exact, repeatable steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
  - type: dropdown
    id: classification
    attributes:
      label: Evidence classification
      options:
        - Verified for this exact test only
        - Partial
        - Failed
        - Untested beyond enumeration
    validations:
      required: true
  - type: textarea
    id: lifecycle
    attributes:
      label: Lifecycle checks
      description: Note disconnect, reconnect, and sleep/wake results, or state that they were not tested.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and claims
      options:
        - label: I removed serial numbers, credentials, usernames, hostnames, and local paths.
          required: true
        - label: I limited the conclusion to the exact hardware and software combination tested.
          required: true
